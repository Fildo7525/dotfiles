[mgr]
linemode = "size_and_mtime"
show_hidden = true
show_symlink = true
scrolloff = 200

[preview]
tab_size = 4

[tasks]
micro_workers = 10
macro_workers = 3
bizare_retry = 5

[input]
cursor_blink = false

[opener]
pdff = [
	{ run = 'zathura "$@"', orphan = true, for = "linux" },
]
play = [
	{ run = 'vlc "$@"', orphan = true, for = "linux" },
]
xournal = [
	{ run = 'xournalpp "$@"', orphan = true, for = "linux" },
]
hex = [
	{ run = 'objdump -x "$@" | gedit -', orphan = true, for = "linux" },
]
readelf = [
	{ run = 'readelf -a "$@" | gedit -', orphan = true, for = "linux" },
]

[open]
prepend_rules = [
	{ url = "*.pdf", use = [ "pdff", "xournal", "reveal", "open" ] },
	{ url = "*.xopp", use = "xournal" },
	{ url = "*.exe", use = "hex" },
	{ url = "*.so", use = "readelf" },
]

[[plugin.prepend_previewers]]
mime = "application/{,g}zip"
run  = "lsar"

[[plugin.prepend_previewers]]
mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}"
run  = "lsar"

[[plugin.prepend_previewers]]
mime = "application/x-elf"
run = "xxd"

